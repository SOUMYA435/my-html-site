<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine 💕</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&amp;family=Quicksand:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    @keyframes pulse-heart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @keyframes fade-in {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    .float-heart {
      animation: float 3s ease-in-out infinite;
    }
    
    .pulse-heart {
      animation: pulse-heart 1.5s ease-in-out infinite;
    }
    
    .fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }
    
    .shake {
      animation: shake 0.5s ease-in-out;
    }
    
    .dancing-script {
      font-family: 'Dancing Script', cursive;
    }
    
    .quicksand {
      font-family: 'Quicksand', sans-serif;
    }
    
    .heart-bg {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 50%, #f48fb1 100%);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(244, 143, 177, 0.5);
    }
    
    .btn-yes {
      background: linear-gradient(135deg, #ec407a 0%, #f48fb1 100%);
      box-shadow: 0 4px 15px rgba(236, 64, 122, 0.4);
      transition: all 0.3s ease;
    }
    
    .btn-yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 64, 122, 0.5);
    }
    
    .btn-no {
      background: linear-gradient(135deg, #b0bec5 0%, #90a4ae 100%);
      transition: all 0.3s ease;
    }
    
    .btn-no:hover {
      transform: scale(0.95);
    }
    
    /* Minimalist Envelope Design */
    .envelope-wrapper {
      width: 110px;
      height: 80px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .envelope-wrapper:hover {
      transform: scale(1.08);
    }
    
    .envelope-body {
      width: 100%;
      height: 100%;
      background: #fce4ec;
      border: 1.5px solid #f48fb1;
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(236, 64, 122, 0.2);
      overflow: hidden;
    }
    
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 35%;
      background: #ec407a;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: 50% 0;
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 3;
    }
    
    .envelope-wrapper:hover .envelope-flap,
    .envelope-open .envelope-flap {
      transform: rotateX(-150deg);
    }
    
    .envelope-paper {
      position: absolute;
      width: 80%;
      height: 50%;
      background: white;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      z-index: 1;
      box-shadow: inset 0 0.5px 2px rgba(0, 0, 0, 0.03);
    }
    
    .envelope-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      z-index: 4;
      transition: transform 0.3s ease;
      display: none;
    }
    
    .envelope-wrapper:hover .envelope-heart {
      transform: translate(-50%, -50%) scale(1.15) rotate(8deg);
    }
    
    .big-popup {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      animation: popupBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes popupBounce {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .popup-box {
      background: linear-gradient(135deg, #ec407a 0%, #f48fb1 100%);
      border: 3px solid white;
      box-shadow: 0 0 30px rgba(236, 64, 122, 0.6);
    }
    
    .modal-overlay {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
    }
    
    .modal-content {
      background: linear-gradient(135deg, #fff5f7 0%, #fce4ec 100%);
      border: 2px solid #f48fb1;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    
    .question-input {
      border: 2px solid #f8bbd9;
      transition: all 0.3s ease;
    }
    
    .question-input:focus {
      border-color: #ec407a;
      box-shadow: 0 0 10px rgba(236, 64, 122, 0.2);
      outline: none;
    }
    
    .spotify-btn {
      background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
      transition: all 0.3s ease;
    }
    
    .spotify-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="h-full quicksand gradient-bg overflow-auto">
  <div id="app" class="min-h-full w-full relative"><!-- Floating Hearts Background -->
   <div id="hearts-bg" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div><!-- Main Content -->
   <div class="relative z-10 min-h-full w-full flex items-center justify-center p-4"><!-- Screen 1: Will you be my Valentine? -->
    <div id="screen-proposal" class="text-center fade-in">
     <div class="glass-card rounded-3xl p-8 md:p-12 max-w-md mx-auto shadow-2xl">
      <div class="text-7xl mb-6 pulse-heart">
       💌
      </div>
      <h1 id="main-title" class="dancing-script text-4xl md:text-5xl text-pink-600 mb-8">Will you be my Valentine?</h1>
      <div class="flex flex-col sm:flex-row gap-4 justify-center"><button id="btn-yes" class="btn-yes text-white font-semibold py-3 px-8 rounded-full text-lg"> Yes 💖 </button> <button id="btn-no" class="btn-no text-white font-semibold py-3 px-8 rounded-full text-lg"> No 😢 </button>
      </div>
      <p id="no-message" class="mt-6 text-pink-500 font-medium hidden"></p>
     </div>
    </div><!-- Screen 2: Yes Response -->
    <div id="screen-yes" class="text-center hidden">
     <div class="glass-card rounded-3xl p-8 md:p-12 max-w-lg mx-auto shadow-2xl fade-in">
      <div class="text-7xl mb-6">
       😚🤭
      </div>
      <h1 id="yes-message" class="dancing-script text-3xl md:text-4xl text-pink-600 mb-4">Yes I know u will say yes Naniii</h1>
      <p class="text-pink-500 text-lg mb-8">I'm so happy! 💕</p><button id="btn-continue" class="btn-yes text-white font-semibold py-3 px-8 rounded-full text-lg"> Open Your Surprises 🎁 </button>
     </div>
    </div><!-- Screen 3: Envelopes -->
    <div id="screen-envelopes" class="text-center hidden w-full">
     <div class="fade-in">
      <h1 class="dancing-script text-4xl md:text-5xl text-pink-600 mb-4">Special Surprises For You</h1>
      <p class="text-pink-500 mb-12 text-lg">Click on each envelope to open 💌</p>
      <div class="grid grid-cols-2 gap-8 md:gap-12 max-w-2xl mx-auto px-4"><!-- Envelope 1: Sweet Questions -->
       <div class="flex flex-col items-center">
        <div class="envelope-wrapper" data-envelope="questions">
         <div class="envelope-body">
          <div class="envelope-paper"></div>
          <div class="envelope-flap"></div>
          <div class="envelope-heart">
           💌
          </div>
         </div>
        </div>
        <p class="mt-4 text-pink-600 font-semibold text-sm">Sweet Questions</p>
       </div><!-- Envelope 2: Our Fav Song -->
       <div class="flex flex-col items-center">
        <div class="envelope-wrapper" data-envelope="song">
         <div class="envelope-body">
          <div class="envelope-paper"></div>
          <div class="envelope-flap"></div>
          <div class="envelope-heart">
           💌
          </div>
         </div>
        </div>
        <p class="mt-4 text-pink-600 font-semibold text-sm">Our Fav Song</p>
       </div><!-- Envelope 3: Love Letter -->
       <div class="flex flex-col items-center">
        <div class="envelope-wrapper" data-envelope="letter">
         <div class="envelope-body">
          <div class="envelope-paper"></div>
          <div class="envelope-flap"></div>
          <div class="envelope-heart">
           💌
          </div>
         </div>
        </div>
        <p class="mt-4 text-pink-600 font-semibold text-sm">Love Letter</p>
       </div><!-- Envelope 4: Dream Places -->
       <div class="flex flex-col items-center">
        <div class="envelope-wrapper" data-envelope="places">
         <div class="envelope-body">
          <div class="envelope-paper"></div>
          <div class="envelope-flap"></div>
          <div class="envelope-heart">
           💌
          </div>
         </div>
        </div>
        <p class="mt-4 text-pink-600 font-semibold text-sm">Dream Places</p>
       </div>
      </div>
     </div>
    </div>
   </div><!-- Modal for Envelope Content -->
   <div id="modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
    <div class="modal-content rounded-3xl p-6 md:p-8 max-w-md w-full max-h-[90%] overflow-y-auto shadow-2xl fade-in">
     <div class="flex justify-between items-start mb-4">
      <h2 id="modal-title" class="dancing-script text-2xl md:text-3xl text-pink-600"></h2><button id="modal-close" class="text-pink-400 hover:text-pink-600 text-3xl leading-none font-bold">×</button>
     </div>
     <div id="modal-content" class="text-pink-700"></div>
    </div>
   </div><!-- Big No Popup -->
   <div id="big-popup" class="fixed inset-0 big-popup z-50 hidden flex items-center justify-center p-4">
    <div class="popup-box rounded-3xl p-8 md:p-12 max-w-sm text-center">
     <h2 id="popup-title" class="dancing-script text-5xl md:text-6xl text-white mb-6">😤💔</h2>
     <p id="popup-message" class="text-2xl md:text-3xl text-white font-bold mb-8 leading-tight dancing-script"></p><button id="popup-continue" class="btn-yes text-white font-semibold py-4 px-8 rounded-full text-lg hover:scale-110 transition"> OK! 😔 </button>
    </div>
   </div>
  </div>
  <script>
    // Default configuration
    const defaultConfig = {
      main_title: "Will you be my Valentine?",
      love_letter_content: "My Dearest Love,\n\nEvery moment with you feels like a beautiful dream. Your smile lights up my world, and your love makes everything better. I can't imagine my life without you.\n\nYou are my sunshine, my happiness, my everything. Thank you for being you and for loving me.\n\nForever yours,\nWith all my heart 💕",
      final_message: "Yes I know u will say yes Naniii 😚🤭",
      background_color: "#fce4ec",
      surface_color: "#ffffff",
      text_color: "#ec407a",
      primary_action_color: "#ec407a",
      secondary_action_color: "#90a4ae",
      font_family: "Quicksand",
      font_size: 16
    };
    
    let config = { ...defaultConfig };
    let currentData = [];
    let noClickCount = 0;
    
    // Sweet questions data
    const sweetQuestions = [
      { id: "q1", question: "What's your favorite memory of us?" },
      { id: "q2", question: "What made you fall in love with me?" },
      { id: "q3", question: "What's your favorite thing about us?" },
      { id: "q4", question: "What do you love most about our relationship?" },
      { id: "q5", question: "What's your dream date with me?" }
    ];
    
    // Dream places data
    const dreamPlaces = [
      { name: "Godavari", description: "The beautiful Godavari river - where nature meets serenity. Imagine us watching the sunset together by the river banks. 🌅" },
      { name: "Kerala", description: "God's Own Country - backwaters, houseboats, and endless greenery. Let's get lost in the beauty of Kerala together! 🌴" },
      { name: "Manali", description: "Snow-capped mountains and cozy moments. Perfect for our romantic getaway! ❄️" },
      { name: "Goa", description: "Beach sunsets, holding hands by the shore. Our paradise awaits! 🏖️" }
    ];
    
    // Create floating hearts
    function createFloatingHearts() {
      const container = document.getElementById('hearts-bg');
      container.innerHTML = '';
      const hearts = ['💕', '💖', '💗', '💓', '💝', '💘', '❤️', '💜', '💛'];
      
      for (let i = 0; i < 25; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-bg float-heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = Math.random() * 100 + '%';
        heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
        heart.style.opacity = Math.random() * 0.5 + 0.2;
        heart.style.animationDelay = Math.random() * 3 + 's';
        heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
        container.appendChild(heart);
      }
    }
    
    // Show screen
    function showScreen(screenId) {
      document.querySelectorAll('#screen-proposal, #screen-yes, #screen-envelopes').forEach(screen => {
        screen.classList.add('hidden');
      });
      const screen = document.getElementById(screenId);
      screen.classList.remove('hidden');
      screen.classList.add('fade-in');
    }
    
    // Handle No button clicks
    function handleNoClick() {
      noClickCount++;
      const popup = document.getElementById('big-popup');
      const popupMessage = document.getElementById('popup-message');
      
      if (noClickCount === 1) {
        popupMessage.textContent = "HOW DARE YOU SAY NO! 😤💔";
      } else if (noClickCount === 2) {
        popupMessage.textContent = "U I AM HURT BUNGA MUTHI PETKUNNA 😭💔";
      } else {
        popupMessage.textContent = "PLEASE SAY YES! 🥺💕";
      }
      
      popup.classList.remove('hidden');
    }
    
    // Close popup
    function closePopup() {
      document.getElementById('big-popup').classList.add('hidden');
    }
    
    // Handle Yes button click
    function handleYesClick() {
      showScreen('screen-yes');
    }
    
    // Show envelopes
    function showEnvelopes() {
      showScreen('screen-envelopes');
    }
    
    // Open modal
    function openModal(title, content) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-content').innerHTML = content;
      document.getElementById('modal').classList.remove('hidden');
    }
    
    // Close modal
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }
    
    // Get saved answer for question
    function getSavedAnswer(questionId) {
      const saved = currentData.find(d => d.question_id === questionId);
      return saved ? saved.answer : '';
    }
    
    // Save answer
    async function saveAnswer(questionId, answer) {
      if (!window.dataSdk) return;
      
      const existing = currentData.find(d => d.question_id === questionId);
      
      if (currentData.length >= 999 && !existing) {
        const errorDiv = document.getElementById('save-error-' + questionId);
        if (errorDiv) {
          errorDiv.textContent = "Maximum answers reached!";
          errorDiv.classList.remove('hidden');
        }
        return;
      }
      
      const saveBtn = document.getElementById('save-btn-' + questionId);
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
      }
      
      try {
        if (existing) {
          existing.answer = answer;
          existing.answered_at = new Date().toISOString();
          const result = await window.dataSdk.update(existing);
          if (!result.isOk) {
            throw new Error('Update failed');
          }
        } else {
          const result = await window.dataSdk.create({
            question_id: questionId,
            answer: answer,
            answered_at: new Date().toISOString()
          });
          if (!result.isOk) {
            throw new Error('Create failed');
          }
        }
        
        if (saveBtn) {
          saveBtn.textContent = 'Saved! 💕';
          setTimeout(() => {
            saveBtn.textContent = 'Save Answer 💾';
            saveBtn.disabled = false;
          }, 2000);
        }
      } catch (error) {
        if (saveBtn) {
          saveBtn.textContent = 'Error - Try again';
          saveBtn.disabled = false;
        }
      }
    }
    
    // Generate questions content
    function generateQuestionsContent() {
      let html = '<div class="space-y-6">';
      
      sweetQuestions.forEach((q, index) => {
        const savedAnswer = getSavedAnswer(q.id);
        html += `
          <div class="bg-white bg-opacity-60 rounded-xl p-4 border border-pink-200">
            <p class="text-pink-600 font-semibold mb-3">${index + 1}. ${q.question}</p>
            <textarea 
              id="answer-${q.id}" 
              class="question-input w-full p-3 rounded-lg text-pink-700 resize-none text-sm" 
              rows="2" 
              placeholder="Write your answer here..."
            >${savedAnswer}</textarea>
            <div class="flex justify-between items-center mt-3">
              <span id="save-error-${q.id}" class="text-red-500 text-xs hidden"></span>
              <button 
                id="save-btn-${q.id}"
                onclick="saveAnswer('${q.id}', document.getElementById('answer-${q.id}').value)"
                class="btn-yes text-white text-xs py-2 px-4 rounded-full ml-auto"
              >
                Save Answer 💾
              </button>
            </div>
          </div>
        `;
      });
      
      html += '</div>';
      return html;
    }
    
    // Generate song content
    function generateSongContent() {
      return `
        <div class="text-center">
          <div class="text-6xl mb-4">🎵</div>
          <h3 class="dancing-script text-2xl text-pink-600 mb-2">Perfect</h3>
          <p class="text-pink-500 mb-2 text-sm">by Ed Sheeran</p>
          <p class="text-pink-600 italic mb-6 text-sm leading-relaxed">"I found a love for me... Darling, just dive right in and follow my lead..."</p>
          <a 
            href="https://open.spotify.com/track/0tgVpDi06FyKpA1z0VMD4v" 
            target="_blank" 
            rel="noopener noreferrer"
            class="spotify-btn inline-flex items-center gap-2 text-white font-semibold py-3 px-6 rounded-full"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            Listen on Spotify
          </a>
        </div>
      `;
    }
    
    // Generate love letter content
    function generateLetterContent() {
      const letterText = config.love_letter_content || defaultConfig.love_letter_content;
      return `
        <div class="text-center">
          <div class="text-5xl mb-4">💝</div>
          <div class="bg-white bg-opacity-70 rounded-xl p-6 text-left border border-pink-200">
            <p class="text-pink-700 whitespace-pre-line leading-relaxed text-sm">${letterText}</p>
          </div>
        </div>
      `;
    }
    
    // Generate places content
    function generatePlacesContent() {
      let html = '<div class="space-y-4">';
      
      dreamPlaces.forEach(place => {
        html += `
          <div class="bg-white bg-opacity-60 rounded-xl p-4 border border-pink-200">
            <h4 class="dancing-script text-lg text-pink-600 mb-2">📍 ${place.name}</h4>
            <p class="text-pink-700 text-sm leading-relaxed">${place.description}</p>
          </div>
        `;
      });
      
      html += '</div>';
      return html;
    }
    
    // Handle envelope click
    function handleEnvelopeClick(envelope) {
      const type = envelope.dataset.envelope;
      envelope.classList.add('envelope-open');
      
      setTimeout(() => {
        switch(type) {
          case 'questions':
            openModal('Sweet Questions 💕', generateQuestionsContent());
            break;
          case 'song':
            openModal('Our Favorite Song 🎵', generateSongContent());
            break;
          case 'letter':
            openModal('Love Letter 💝', generateLetterContent());
            break;
          case 'places':
            openModal('Dream Places ✈️', generatePlacesContent());
            break;
        }
      }, 500);
    }
    
    // Apply configuration
    async function onConfigChange(cfg) {
      config = { ...defaultConfig, ...cfg };
      
      // Update main title
      const mainTitle = document.getElementById('main-title');
      if (mainTitle) {
        mainTitle.textContent = config.main_title || defaultConfig.main_title;
      }
      
      // Update yes message
      const yesMessage = document.getElementById('yes-message');
      if (yesMessage) {
        yesMessage.textContent = config.final_message || defaultConfig.final_message;
      }
      
      // Apply colors
      document.body.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color} 0%, #f8bbd9 50%, ${config.primary_action_color || defaultConfig.primary_action_color} 100%)`;
      
      // Apply font
      const customFont = config.font_family || defaultConfig.font_family;
      document.querySelectorAll('.quicksand').forEach(el => {
        el.style.fontFamily = `${customFont}, Quicksand, sans-serif`;
      });
      
      // Apply font size
      const baseSize = config.font_size || defaultConfig.font_size;
      document.querySelectorAll('p, button').forEach(el => {
        if (!el.classList.contains('dancing-script')) {
          el.style.fontSize = `${baseSize}px`;
        }
      });
    }
    
    // Map to capabilities
    function mapToCapabilities(cfg) {
      return {
        recolorables: [
          {
            get: () => cfg.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
